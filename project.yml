name: AppDust

options:
  bundleIdPrefix: com.rocaltair
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: NO
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  AppDust:
    type: application
    platform: macOS
    sources:
      - path: AppDust
        excludes:
          - "Info.plist"
    settings:
      base:
        INFOPLIST_FILE: AppDust/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.rocaltair.AppDust
        PRODUCT_NAME: AppDust
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

schemes:
  AppDust:
    build:
      targets:
        AppDust: all
    run:
      config: Release
    archive:
      config: Release
